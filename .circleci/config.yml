version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.3
  node-with-postgres:
    docker:
      - image: cimg/node:22.23.3
        environment:
          DB_HOST: localhost
          DB_NAME: ecommerce_test_db
      - image: cimg/postgres:16.15
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test_db

commands:
  install:
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-modules-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: '[ -d node_modules ] || npm ci --no-audit --no-fund'
      - save_cache:
          key: node-modules-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

jobs:
  lint-and-typecheck:
    executor: node
    steps:
      - install
      - run: npm run lint
      # Type errors can reach code that tests never execute; check every commit.
      - run: npm run typecheck

  unit-tests:
    executor: node
    steps:
      - install
      - run: circleci testsuite run "unit tests"

  integration-tests:
    executor: node-with-postgres
    parallelism: 3
    steps:
      - install
      - run:
          name: Wait for Postgres
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run: circleci testsuite run "integration tests"

workflows:
  test:
    jobs:
      - lint-and-typecheck
      - unit-tests
      - integration-tests
